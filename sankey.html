        // 计算机制到Y的连接数量
        function calculateMechanismLinks() {
            const mechanismLinkCount = {};
            
            data.links.forEach(link => {
                const sourceNode = data.nodes.find(node => node.name === link.source);
                const targetNode = data.nodes.find(node => node.name === link.target);
                
                // 只计算机制到Y的连接
                if (sourceNode && targetNode && sourceNode.category === 2 && targetNode.category === 3) {
                    if (!mechanismLinkCount[link.source]) {
                        mechanismLinkCount[link.source] = 0;
                    }
                    mechanismLinkCount[link.source]++;
                }
            });
            
            return mechanismLinkCount;
        }

        // 为机制分配颜色
        function assignMechanismColors() {
            const mechanismLinkCount = calculateMechanismLinks();
            const mechanismNames = Object.keys(mechanismLinkCount);
            
            // 按连接数排序
            const sortedMechanisms = mechanismNames.sort((a, b) => mechanismLinkCount[b] - mechanismLinkCount[a]);
            
            // 定义颜色范围
            const colorPalette = [
                '#FFB6C1', '#FFD700', '#98FB98', '#87CEEB', '#DDA0DD', '#F0E68C',
                '#E6E6FA', '#FFA07A', '#20B2AA', '#DEB887', '#FF69B4', '#00FA9A',
                '#FFDAB9', '#B0C4DE', '#FF6347', '#7FFFD4', '#FFFACD', '#F5DEB3'
            ];
            
            const mechanismColors = {};
            const topMechanisms = sortedMechanisms.slice(0, 3);
            
            // 为连接数最多的三个机制分配最深的颜色
            const deepColors = ['#8B0000', '#006400', '#00008B'];
            
            sortedMechanisms.forEach((mechanism, index) => {
                if (index < 3) {
                    mechanismColors[mechanism] = deepColors[index];
                } else {
                    mechanismColors[mechanism] = colorPalette[index % colorPalette.length];
                }
            });
            
            return {
                mechanismColors,
                mechanismLinkCount,
                topMechanisms
            };
        }

        // 应用机制颜色到链接和节点
        // 应用机制颜色到链接和节点
        function applyMechanismColors() {
            const { mechanismColors, mechanismLinkCount, topMechanisms } = assignMechanismColors();
            
            // 更新链接颜色
            data.links.forEach(link => {
                const sourceNode = data.nodes.find(node => node.name === link.source);
                const targetNode = data.nodes.find(node => node.name === link.target);
                
                // 添加防御性检查，确保节点存在且有category属性
                if (!sourceNode || !targetNode || sourceNode.category === undefined || targetNode.category === undefined) {
                    console.warn('找不到节点或节点缺少category属性:', link.source, '->', link.target);
                    link.lineStyle = {
                        color: 'rgba(180, 180, 180, 0.4)',
                        curveness: 0.5
                    };
                    return; // 跳过这个链接的处理
                }
                
                // 机制到Y的连接使用机制对应的颜色
                if (sourceNode.category === 2 && targetNode.category === 3) {
                    link.lineStyle = {
                        color: mechanismColors[link.source],
                        opacity: topMechanisms.includes(link.source) ? 0.8 : 0.5,
                        curveness: 0.5
                    };
                } 
                // 前两个层次的链接颜色较浅
                else if ((sourceNode.category === 0 && targetNode.category === 1) || 
                        (sourceNode.category === 1 && targetNode.category === 2)) {
                    link.lineStyle = {
                        color: 'rgba(180, 180, 180, 0.3)',
                        curveness: 0.5
                    };
                }
                // 其他链接使用默认颜色
                else {
                    link.lineStyle = {
                        color: 'rgba(180, 180, 180, 0.4)',
                        curveness: 0.5
                    };
                }
            });
            
            // 更新节点样式 - 为连接数最多的三个机制设置白色字体和更大字号
            data.nodes.forEach(node => {
                if (node.category === 2 && topMechanisms.includes(node.name)) {
                    node.itemStyle = {
                        color: mechanismColors[node.name],
                        borderColor: '#ffffff',
                        borderWidth: 2
                    };
                    node.label = {
                        color: '#ffffff',
                        fontWeight: 'bold',
                        fontSize: 13
                    };
                }
            });
            
            return { mechanismColors, mechanismLinkCount, topMechanisms };
        }

        // 创建机制图例
        function createMechanismLegend(mechanismColors, mechanismLinkCount, topMechanisms) {
            const legendContainer = document.getElementById('mechanismLegend');
            legendContainer.innerHTML = '';
            
            const sortedMechanisms = Object.keys(mechanismColors).sort((a, b) => mechanismLinkCount[b] - mechanismLinkCount[a]);
            
            sortedMechanisms.forEach(mechanism => {
                const legendItem = document.createElement('div');
                legendItem.className = 'legend-item';
                
                const isTopMechanism = topMechanisms.includes(mechanism);
                
                legendItem.innerHTML = `
                    <div class="color-box" style="background-color: ${mechanismColors[mechanism]}; ${isTopMechanism ? 'border: 2px solid #000;' : ''}"></div>
                    <div class="legend-text">
                        ${mechanism} 
                        <span style="color: #666; font-size: 0.8rem;">(${mechanismLinkCount[mechanism]}个连接${isTopMechanism ? ' ⭐' : ''})</span>
                    </div>
                `;
                
                legendContainer.appendChild(legendItem);
            });
        }

        // 应用机制颜色并创建图例
        const { mechanismColors, mechanismLinkCount, topMechanisms } = applyMechanismColors();
        createMechanismLegend(mechanismColors, mechanismLinkCount, topMechanisms);

            myChart.resize();
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            myChart.setOption(option);
        });
        
        document.getElementById('highlightBtn').addEventListener('click', function() {
            // 高亮显示关键机制
            var highlightOption = JSON.parse(JSON.stringify(option));
            highlightOption.series[0].lineStyle.opacity = 0.1;
            highlightOption.series[0].emphasis.lineStyle.opacity = 0.8;
            
            // 高亮关键机制节点
            highlightOption.series[0].data.forEach(function(node, index) {
                if (topMechanisms.includes(node.name)) {
                    node.itemStyle = {
                        color: mechanismColors[node.name],
                        borderColor: '#ffffff',
                        borderWidth: 3,
                        shadowBlur: 10,
                        shadowColor: 'rgba(241, 196, 15, 0.5)'
                    };
                    node.label = {
                        color: '#ffffff',
                        fontWeight: 'bold',
                        fontSize: 14
                    };
                } else {
                    node.itemStyle = {
                        opacity: 0.3
                    };
                }
            });
            
            myChart.setOption(highlightOption);
        });
        
        document.getElementById('exportBtn').addEventListener('click', function() {
            var imgData = myChart.getDataURL({
                type: 'png',
                pixelRatio: 2,
                backgroundColor: '#fff'
            });
            var link = document.createElement('a');
            link.href = imgData;
            link.download = '社保政策影响机制桑基图.png';
            link.click();
